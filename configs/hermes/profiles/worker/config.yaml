model:
  provider: opencode-go
  default: kimi-k2.7-code
terminal:
  cwd: /var/lib/hermes/workspace
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
plugins:
  enabled:
  - session-vault-export
approvals:
  mode: smart
memory:
  memory_enabled: true
  user_profile_enabled: true
privacy:
  redact_pii: true
platforms:
  slack:
    extra:
      rich_blocks: true
