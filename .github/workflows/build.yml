name: Build nix configurations

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # darwin の system closure には linux-builder guest の NixOS toplevel
  # (aarch64-linux) が含まれる。macos runner ではこれをビルドできず cachix からの
  # substitute に頼るしかないため、cachix が evict すると CI が PR の内容と無関係に
  # platform mismatch で落ち、人間が Mac から push するまで復旧しない。
  # aarch64-linux runner でこれを毎回ビルドし直して cachix に載せることで、
  # evict されても CI が自力で復旧できるようにする。guest は両ホスト共通。
  linux-builder-guest:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: thinceller-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build linux-builder guest
        run: |
          nix build .#darwinConfigurations.kohei-m4-mac-mini.config.nix.linux-builder.package.nixosConfig.system.build.toplevel --show-trace

  build:
    needs: linux-builder-guest
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host:
          - kohei-m4-mac-mini
          - SC-N-843
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: thinceller-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build nix-darwin configuration
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.system --show-trace

  # oberon は comin による pull 型 deploy (master を polling して on-server build
  # → 自動 switch) なので、master が壊れていると自動デプロイが黙って失敗する。
  # それを CI で検知しつつ、closure を cachix に push して oberon 上のビルドを
  # substitute で済ませる (2GB RAM でのローカルビルドを避ける)。
  build-nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: thinceller-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build oberon configuration
        run: |
          nix build .#nixosConfigurations.oberon.config.system.build.toplevel --show-trace

  diff:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: thinceller-dotfiles
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Diff nix-darwin configurations
        uses: natsukium/nix-diff-action@main
        with:
          attributes: |
            - displayName: kohei-m4-mac-mini
              attribute: darwinConfigurations.kohei-m4-mac-mini.system
            - displayName: SC-N-843
              attribute: darwinConfigurations.SC-N-843.system
